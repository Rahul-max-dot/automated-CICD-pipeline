apiVersion: apps/v1
kind: Deployment

metadata:
  name: automated-cicd-pipeline

spec:
  replicas: 2

  selector:
    matchLabels:
      app: automated-cicd-pipeline

  template:
    metadata:
      labels:
        app: automated-cicd-pipeline

    spec:
      containers:

      - name: automated-cicd-pipeline

        image: YOUR_DOCKER_USERNAME/automated-cicd-pipeline:latest

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /
            port: 8080

          initialDelaySeconds: 20
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 8080

          initialDelaySeconds: 30
          periodSeconds: 20
